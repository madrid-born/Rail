<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rail screen gallery</title><link rel="stylesheet" href="style.css"><script src="data.js" defer></script><script src="gallery.js" defer></script>
<style>body{background:#e9efeb;color:#102c34}.gallery{max-width:1350px;margin:auto;padding:26px}.gallery h1{font-size:40px;letter-spacing:-.04em}.gallery h2{margin:25px 0 10px}.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,205px),1fr));gap:12px}.gallery-grid.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,350px),1fr))}.gallery figure{min-width:0;margin:0;background:#fffefa;padding:10px;border-radius:14px;border:1px solid #d0dfda}.gallery img{display:block;width:100%;height:300px;object-fit:contain;object-position:top}.gallery .wide img{height:auto}.gallery figcaption{font-size:13px;margin-top:9px}.gallery small{display:block;color:#465f62}.gallery a:focus-visible{outline:2px solid #00636a}</style>
</head><body><main class="gallery"><a href="index.html">← Design studio</a><h1>Screen gallery</h1><p>Open an image to see it at full size.</p><div id="gallery"></div></main></body></html>
